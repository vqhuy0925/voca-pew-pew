    <!-- Google Fonts: Orbitron (Star Wars style), Fredoka & Press Start 2P (Loaded asynchronously to prevent render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" />
    </noscript>
    <script>
      (function() {
        var h = window.location.hostname.toLowerCase();
        if (h.indexOf('vercel.app') !== -1 && h.indexOf('vocabpewpew.com') === -1 && h.indexOf('localhost') === -1) {
          try {
            var payload = {};
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && (k.indexOf('vocab_') === 0 || k.indexOf('typing_') === 0)) {
                var v = localStorage.getItem(k);
                if (v) payload[k] = v;
              }
            }
            var target = 'https://www.vocabpewpew.com' + window.location.pathname + window.location.hash;
            if (Object.keys(payload).length === 0) {
              window.location.replace(target);
              return;
            }

            // Create hidden sync iframe to bypass URI length limits
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'https://www.vocabpewpew.com/sync-bridge.html';

            var redirected = false;
            var go = function() {
              if (!redirected) {
                redirected = true;
                window.location.replace(target);
              }
            };

            var timer = setTimeout(go, 1500);

            window.addEventListener('message', function(e) {
              if (e.origin && e.origin.indexOf('vocabpewpew.com') !== -1 && e.data && e.data.type === 'MIGRATE_SUCCESS') {
                clearTimeout(timer);
                go();
              }
            });

            iframe.onload = function() {
              try {
                iframe.contentWindow.postMessage({ type: 'MIGRATE_PAYLOAD', payload: payload }, '*');
              } catch(err) {
                go();
              }
            };
            iframe.onerror = go;

            if (document.body) {
              document.body.appendChild(iframe);
            } else {
              window.addEventListener('DOMContentLoaded', function() {
                document.body.appendChild(iframe);
              });
            }
          } catch (e) {
            window.location.replace('https://www.vocabpewpew.com' + window.location.pathname + window.location.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-space-dark text-white overflow-hidden select-none font-game antialiased">
