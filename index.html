    <script>
      (function() {
        var h = window.location.hostname.toLowerCase();
        if (h.indexOf('vercel.app') !== -1 && h.indexOf('vocabpewpew.com') === -1 && h.indexOf('localhost') === -1) {
          try {
            var raw = localStorage.getItem('vocab_pew_pew_user_progress_v2') || localStorage.getItem('vocab_pew_pew_user_progress_v1');
            var target = 'https://www.vocabpewpew.com' + window.location.pathname + window.location.hash;
            if (!raw) {
              window.location.replace(target);
              return;
            }

            var full = JSON.parse(raw);
            var completedLevels = {};
            if (full && full.levelProgressMap) {
              for (var id in full.levelProgressMap) {
                var item = full.levelProgressMap[id];
                if (item && (item.isCompleted || (item.stars && item.stars > 0))) {
                  completedLevels[id] = [item.stars || 0, item.highScore || 0];
                }
              }
            }

            var compact = {
              v: 2,
              u: full.userName || undefined,
              a: full.avatar || undefined,
              g: typeof full.gems === 'number' ? full.gems : undefined,
              x: typeof full.totalXp === 'number' ? full.totalXp : undefined,
              s: typeof full.streakDays === 'number' ? full.streakDays : undefined,
              c: full.currentLevelId || undefined,
              p: full.playerTag || undefined,
              uid: full.cloudUid || undefined,
              eq: [full.equippedShipId || 'ship-scout', full.equippedBlasterId || 'blaster-single', full.equippedLaserId || 'laser-cyan'],
              up: Array.isArray(full.unlockedUpgradeIds) ? full.unlockedUpgradeIds : undefined,
              lvl: Object.keys(completedLevels).length > 0 ? completedLevels : undefined
            };

            var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
            var sep = target.indexOf('?') === -1 ? '?' : '&';
            window.location.replace(target + sep + 'migrate_sync=' + encodeURIComponent(encoded));
          } catch (e) {
            window.location.replace('https://www.vocabpewpew.com' + window.location.pathname + window.location.hash);
          }
        }
      })();
    </script>
