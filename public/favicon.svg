<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Fin Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Window Gradient -->
    <radialGradient id="windowGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Cosmic Background Squircle / Round Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Starry sparkles in background -->
  <circle cx="110" cy="110" r="4" fill="#a5f3fc" opacity="0.8" />
  <circle cx="420" cy="130" r="3.5" fill="#fef08a" opacity="0.9" />
  <circle cx="100" cy="380" r="3" fill="#ffffff" opacity="0.7" />
  <circle cx="430" cy="390" r="5" fill="#38bdf8" opacity="0.8" />
  <circle cx="260" cy="70" r="2.5" fill="#ffffff" opacity="0.6" />

  <!-- Neon Ring -->
  <circle cx="256" cy="245" r="175" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="16 12" stroke-opacity="0.3" filter="url(#glowCyan)"/>

  <!-- Rocket Group rotated 45 deg -->
  <g transform="translate(256, 245) rotate(45)">
    <!-- Rocket Flame -->
    <path d="M-28,95 Q0,195 0,225 Q0,195 28,95 Z" fill="url(#flameGrad)" filter="url(#glowCyan)"/>
    <path d="M-14,95 Q0,150 0,170 Q0,150 14,95 Z" fill="#ffffff"/>

    <!-- Left Fin -->
    <path d="M-38,40 L-95,85 Q-75,100 -40,95 Z" fill="url(#finGrad)"/>
    <!-- Right Fin -->
    <path d="M38,40 L95,85 Q75,100 40,95 Z" fill="url(#finGrad)"/>

    <!-- Rocket Body -->
    <path d="M0,-140 C60,-45 65,55 45,95 L-45,95 C-65,55 -60,-45 0,-140 Z" fill="url(#rocketBody)" stroke="#e0f2fe" stroke-width="4"/>

    <!-- Center Fin / Stripe -->
    <path d="M-7,30 L7,30 L5,95 L-5,95 Z" fill="url(#finGrad)"/>

    <!-- Portal / Window Frame & Glass -->
    <circle cx="0" cy="-20" r="36" fill="#1e293b" stroke="#e0f2fe" stroke-width="6"/>
    <circle cx="0" cy="-20" r="26" fill="url(#windowGrad)"/>
    <!-- Glass reflection -->
    <ellipse cx="-8" cy="-28" rx="8" ry="4" fill="#ffffff" opacity="0.7" transform="rotate(-30, -8, -28)"/>

    <!-- Nose Cone Tip Accent -->
    <path d="M0,-140 C18,-110 24,-85 0,-70 C-24,-85 -18,-110 0,-140 Z" fill="#f43f5e"/>
  </g>
</svg>
